name: Publish images

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "opencog/**"
      - ".github/workflows/**"
  push:
    branches: [ "master" ]
    paths:
      - "opencog/**"
      - ".github/workflows/**"
  schedule:
    - cron: "37 2 * * 6"  # Run 2:37 AM Saturday night. `man 5 crontab`
  workflow_dispatch:

# Permissions grants access to the private GITHUB_TOKEN
# which is needed for publishing images to ghcr.io
permissions:
  contents: read
  packages: write

jobs:

  # The job is called "base-images".
  # The Dockerfile is located in the directory opencog/base
  #     -- this is the "context"
  # The name of the docker image is opencog/opencog-deps:latest
  base-images:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Do NOT push builds from unmerged pull reqs!!
      - name: Build and push opencog-deps
        uses: docker/build-push-action@v7
        with:
          context: opencog/base
          tags: |
            ${{ secrets.DOCKER_NAMESPACE }}/opencog-deps:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.job }}:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: ${{ github.event_name != 'pull_request' }}

  # "needs:" provides the name of the job, above.
  atomspace:
    needs: base-images
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Do NOT push builds from unmerged pull reqs!!
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: opencog/${{ github.job }}
          tags: |
            ${{ secrets.DOCKER_NAMESPACE }}/${{ github.job }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.job }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: This is the droid you are looking for!
        if: always()
        run: |
          echo "### Advice to the Lovelorn :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "If the build failed, click on the job, then click on the gear icon and then click 'View raw logs'." >> $GITHUB_STEP_SUMMARY

      # This places a message at the top of the job page, but you have
      # to click through to see the message, so it seems useless...
      # - name: Testing! Testing! 1,2,3.
      #   run: |
      #     echo "::notice title=Your-name-here::check check"


  atomspace-py:
    needs: atomspace
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
