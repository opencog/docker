#
# The opencode client needs a 24-bit color terminal to work corretly.
# byobu/tmux defaults to a 256-color terminal. Fix this.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set-environment -g COLORTERM "truecolor"
